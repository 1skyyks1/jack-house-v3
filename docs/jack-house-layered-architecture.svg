<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Jack House layered architecture</title>
  <desc id="desc">Layered architecture diagram for Jack House V3 frontend, backend services, domain services, and infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="126%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#334155" flood-opacity="0.09"/>
    </filter>
    <style>
      .title { font: 750 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .layer-title { font: 750 33px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .card-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243246; text-anchor: middle; }
      .box-title { font: 650 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2f3b4f; text-anchor: middle; }
      .box-sub { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; text-anchor: middle; }
      .tiny { font: 650 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; text-anchor: middle; letter-spacing: .2px; }
      .access-card { fill: #edf5ff; stroke: #7ea5d8; stroke-width: 2.6; filter: url(#shadow); }
      .access-box { fill: #ffffff; stroke: #7ea5d8; stroke-width: 2; }
      .app-card { fill: #fff7df; stroke: #d8b95f; stroke-width: 2.4; filter: url(#shadow); }
      .app-box { fill: #ffffff; stroke: #d8b95f; stroke-width: 2; }
      .domain-card { fill: #f3effd; stroke: #a58add; stroke-width: 2.4; filter: url(#shadow); }
      .domain-box { fill: #ffffff; stroke: #a58add; stroke-width: 2; }
      .infra-card { fill: #eef2ff; stroke: #7688c1; stroke-width: 2.4; filter: url(#shadow); }
      .infra-box { fill: #ffffff; stroke: #7688c1; stroke-width: 2; }
      .storage-card { fill: #eef2ff; stroke: #7688c1; stroke-width: 2.4; filter: url(#shadow); }
      .storage-box { fill: #ffffff; stroke: #7688c1; stroke-width: 2; }
      .stroke-soft { stroke: #e5ebf3; stroke-width: 1; opacity: .72; }
      .pill { fill: #ffffff; stroke: #d7dee8; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1800" height="1280" fill="url(#bg)"/>
  <path class="stroke-soft" d="M0 160 H1800 M0 320 H1800 M0 480 H1800 M0 640 H1800 M0 800 H1800 M0 960 H1800 M0 1120 H1800 M220 0 V1280 M440 0 V1280 M660 0 V1280 M880 0 V1280 M1100 0 V1280 M1320 0 V1280 M1540 0 V1280"/>

  <text x="80" y="74" class="title">Jack House layered architecture</text>
  <text x="80" y="104" class="subtitle">Layered view of jack-house-v3, jack-house-web/backend, analytics, storage, and external integrations</text>
  <rect x="1472" y="58" width="248" height="36" rx="18" class="pill"/>
  <text x="1596" y="81" class="tiny">www.jackhouse.xyz + api.jackhouse.xyz</text>

  <!-- Access layer -->
  <text x="84" y="235" class="layer-title">接入层</text>
  <rect x="250" y="158" width="1480" height="272" rx="18" class="access-card"/>
  <rect x="280" y="188" width="1420" height="64" rx="13" class="access-box"/>
  <text x="990" y="227" class="card-title">Nginx / reverse proxy / HTTPS entry</text>

  <rect x="280" y="278" width="1420" height="64" rx="13" class="access-box"/>
  <text x="990" y="316" class="card-title">Express gateway middleware</text>
  <rect x="310" y="360" width="315" height="50" rx="12" class="access-box"/>
  <text x="467" y="390" class="box-title">CORS allowlist</text>
  <rect x="648" y="360" width="315" height="50" rx="12" class="access-box"/>
  <text x="805" y="390" class="box-title">HTTP-only cookies</text>
  <rect x="986" y="360" width="315" height="50" rx="12" class="access-box"/>
  <text x="1143" y="390" class="box-title">CSRF protection</text>
  <rect x="1324" y="360" width="315" height="50" rx="12" class="access-box"/>
  <text x="1481" y="390" class="box-title">Rate limiting</text>

  <!-- Application layer -->
  <text x="84" y="548" class="layer-title">应用层</text>
  <rect x="250" y="470" width="645" height="246" rx="18" class="app-card"/>
  <text x="572" y="515" class="card-title">jack-house-v3</text>
  <text x="572" y="538" class="box-sub">React 19 + Vite + TypeScript SPA</text>
  <rect x="282" y="570" width="180" height="52" rx="12" class="app-box"/>
  <text x="372" y="600" class="box-title">Public pages</text>
  <text x="372" y="617" class="box-sub">home / about</text>
  <rect x="482" y="570" width="180" height="52" rx="12" class="app-box"/>
  <text x="572" y="600" class="box-title">Community</text>
  <text x="572" y="617" class="box-sub">forum / posts</text>
  <rect x="682" y="570" width="180" height="52" rx="12" class="app-box"/>
  <text x="772" y="600" class="box-title">Packs</text>
  <text x="772" y="617" class="box-sub">list / detail / submit</text>
  <rect x="282" y="642" width="180" height="52" rx="12" class="app-box"/>
  <text x="372" y="672" class="box-title">Tournaments</text>
  <text x="372" y="689" class="box-sub">qualifier / bracket</text>
  <rect x="482" y="642" width="180" height="52" rx="12" class="app-box"/>
  <text x="572" y="672" class="box-title">Admin console</text>
  <text x="572" y="689" class="box-sub">ops / content</text>
  <rect x="682" y="642" width="180" height="52" rx="12" class="app-box"/>
  <text x="772" y="672" class="box-title">Shared runtime</text>
  <text x="772" y="689" class="box-sub">query / i18n / theme</text>

  <rect x="920" y="470" width="810" height="246" rx="18" class="app-card"/>
  <text x="1325" y="515" class="card-title">jack-house-web/backend</text>
  <text x="1325" y="538" class="box-sub">Node.js + Express + Sequelize API service</text>
  <rect x="954" y="570" width="170" height="52" rx="12" class="app-box"/>
  <text x="1039" y="600" class="box-title">Auth API</text>
  <text x="1039" y="617" class="box-sub">osu! login</text>
  <rect x="1142" y="570" width="170" height="52" rx="12" class="app-box"/>
  <text x="1227" y="600" class="box-title">User API</text>
  <text x="1227" y="617" class="box-sub">profile / roles</text>
  <rect x="1330" y="570" width="170" height="52" rx="12" class="app-box"/>
  <text x="1415" y="600" class="box-title">Content API</text>
  <text x="1415" y="617" class="box-sub">posts / files</text>
  <rect x="1518" y="570" width="170" height="52" rx="12" class="app-box"/>
  <text x="1603" y="600" class="box-title">Pack API</text>
  <text x="1603" y="617" class="box-sub">tags / comments</text>
  <rect x="954" y="642" width="232" height="52" rx="12" class="app-box"/>
  <text x="1070" y="672" class="box-title">Tournament API</text>
  <text x="1070" y="689" class="box-sub">teams / qualifier / bracket</text>
  <rect x="1206" y="642" width="232" height="52" rx="12" class="app-box"/>
  <text x="1322" y="672" class="box-title">Admin APIs</text>
  <text x="1322" y="689" class="box-sub">badge / event / dashboard</text>
  <rect x="1458" y="642" width="232" height="52" rx="12" class="app-box"/>
  <text x="1574" y="672" class="box-title">Analytics APIs</text>
  <text x="1574" y="689" class="box-sub">collect / stats</text>

  <!-- Domain layer -->
  <text x="84" y="840" class="layer-title">领域层</text>
  <rect x="250" y="774" width="420" height="212" rx="18" class="domain-card"/>
  <text x="460" y="814" class="card-title">Account domain</text>
  <rect x="280" y="846" width="160" height="52" rx="12" class="domain-box"/>
  <text x="360" y="877" class="box-title">Auth service</text>
  <rect x="460" y="846" width="180" height="52" rx="12" class="domain-box"/>
  <text x="550" y="877" class="box-title">Permission model</text>
  <rect x="280" y="918" width="360" height="52" rx="12" class="domain-box"/>
  <text x="460" y="949" class="box-title">User / badge / profile models</text>

  <rect x="690" y="774" width="500" height="212" rx="18" class="domain-card"/>
  <text x="940" y="814" class="card-title">Tournament domain</text>
  <rect x="720" y="846" width="210" height="52" rx="12" class="domain-box"/>
  <text x="825" y="877" class="box-title">Team service</text>
  <rect x="950" y="846" width="210" height="52" rx="12" class="domain-box"/>
  <text x="1055" y="877" class="box-title">Qualifier service</text>
  <rect x="720" y="918" width="210" height="52" rx="12" class="domain-box"/>
  <text x="825" y="949" class="box-title">Bracket service</text>
  <rect x="950" y="918" width="210" height="52" rx="12" class="domain-box"/>
  <text x="1055" y="949" class="box-title">Referee actions</text>

  <rect x="1210" y="774" width="520" height="212" rx="18" class="domain-card"/>
  <text x="1470" y="814" class="card-title">Content and analytics domain</text>
  <rect x="1240" y="846" width="220" height="52" rx="12" class="domain-box"/>
  <text x="1350" y="877" class="box-title">Pack service</text>
  <rect x="1480" y="846" width="220" height="52" rx="12" class="domain-box"/>
  <text x="1590" y="877" class="box-title">Forum service</text>
  <rect x="1240" y="918" width="220" height="52" rx="12" class="domain-box"/>
  <text x="1350" y="949" class="box-title">Rich text assets</text>
  <rect x="1480" y="918" width="220" height="52" rx="12" class="domain-box"/>
  <text x="1590" y="949" class="box-title">Analytics service</text>

  <!-- Infrastructure layer -->
  <text x="84" y="1140" class="layer-title">基建层</text>
  <rect x="250" y="1050" width="680" height="174" rx="18" class="infra-card"/>
  <text x="590" y="1092" class="card-title">Runtime and deployment</text>
  <rect x="286" y="1122" width="188" height="54" rx="12" class="infra-box"/>
  <text x="380" y="1153" class="box-title">Static hosting</text>
  <text x="380" y="1170" class="box-sub">V3 dist</text>
  <rect x="494" y="1122" width="188" height="54" rx="12" class="infra-box"/>
  <text x="588" y="1153" class="box-title">Node process</text>
  <text x="588" y="1170" class="box-sub">Express API</text>
  <rect x="702" y="1122" width="188" height="54" rx="12" class="infra-box"/>
  <text x="796" y="1153" class="box-title">Env checks</text>
  <text x="796" y="1170" class="box-sub">deploy scripts</text>

  <rect x="960" y="1050" width="770" height="174" rx="18" class="storage-card"/>
  <text x="1345" y="1092" class="card-title">Common storage and external integrations</text>
  <rect x="1000" y="1122" width="150" height="54" rx="12" class="storage-box"/>
  <text x="1075" y="1153" class="box-title">MariaDB</text>
  <text x="1075" y="1170" class="box-sub">business data</text>
  <rect x="1170" y="1122" width="150" height="54" rx="12" class="storage-box"/>
  <text x="1245" y="1153" class="box-title">Analytics DB</text>
  <text x="1245" y="1170" class="box-sub">events / stats</text>
  <rect x="1340" y="1122" width="150" height="54" rx="12" class="storage-box"/>
  <text x="1415" y="1153" class="box-title">S3 storage</text>
  <text x="1415" y="1170" class="box-sub">media assets</text>
  <rect x="1510" y="1122" width="180" height="54" rx="12" class="storage-box"/>
  <text x="1600" y="1153" class="box-title">osu! / Sheets</text>
  <text x="1600" y="1170" class="box-sub">OAuth, API, imports</text>
</svg>
