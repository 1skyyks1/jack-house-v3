<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Jack House V3 frontend and backend service architecture</title>
  <desc id="desc">Modern architecture diagram showing browser users, React V3 frontend, Express backend, analytics, storage, database, and external integrations.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f7fb9"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f9f83"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .section-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .muted { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .tiny { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: .2px; }
      .label-center { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; text-anchor: middle; }
      .muted-center { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; text-anchor: middle; }
      .tiny-center { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: .2px; text-anchor: middle; }
      .card { fill: #ffffff; stroke: #d7dee8; stroke-width: 1.2; filter: url(#shadow); }
      .soft { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .frontend { fill: #edf5ff; stroke: #b9cce5; }
      .backend { fill: #edf8f3; stroke: #b7d7c8; }
      .analytics { fill: #f2effb; stroke: #c9bee5; }
      .data { fill: #fff7e8; stroke: #dec88b; }
      .external { fill: #f7f4ef; stroke: #d8cfc1; }
      .security { fill: #fff1f2; stroke: #e6b8bf; }
      .chip { fill: rgba(255,255,255,0.70); stroke: rgba(100,116,139,0.22); }
      .line { fill: none; stroke: #64748b; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #4f7fb9; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .line-green { fill: none; stroke: #5f9f83; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .line-dashed { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1040" fill="url(#page)"/>
  <path d="M0 180 H1800 M0 360 H1800 M0 540 H1800 M0 720 H1800 M0 900 H1800 M220 0 V1040 M440 0 V1040 M660 0 V1040 M880 0 V1040 M1100 0 V1040 M1320 0 V1040 M1540 0 V1040 M1760 0 V1040" stroke="#e7edf5" stroke-width="1" opacity="0.6"/>

  <text x="70" y="74" class="title">Jack House service architecture</text>
  <text x="70" y="104" class="subtitle">V3 React frontend, Express backend, analytics collection, storage, and external integrations</text>
  <rect x="1490" y="58" width="235" height="36" rx="18" fill="#ffffff" stroke="#d7dee8"/>
  <text x="1510" y="81" class="tiny">www.jackhouse.xyz + api.jackhouse.xyz</text>

  <!-- Users -->
  <rect x="70" y="170" width="230" height="250" rx="22" class="card"/>
  <text x="100" y="213" class="section-title">Clients</text>
  <rect x="100" y="240" width="170" height="48" rx="14" class="soft"/>
  <text x="185" y="269" class="label-center">Public users</text>
  <rect x="100" y="302" width="170" height="48" rx="14" class="soft"/>
  <text x="185" y="331" class="label-center">Admins / staff</text>
  <rect x="100" y="364" width="170" height="34" rx="17" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="185" y="386" class="muted-center">Browser session</text>

  <!-- Frontend -->
  <rect x="380" y="145" width="430" height="330" rx="26" class="card frontend"/>
  <text x="420" y="190" class="section-title">jack-house-v3</text>
  <text x="420" y="214" class="muted">React 19 + Vite + TypeScript SPA</text>

  <rect x="420" y="242" width="160" height="46" rx="14" class="chip"/>
  <text x="500" y="271" class="label-center">React Router</text>
  <rect x="602" y="242" width="168" height="46" rx="14" class="chip"/>
  <text x="686" y="271" class="label-center">TanStack Query</text>
  <rect x="420" y="304" width="160" height="46" rx="14" class="chip"/>
  <text x="500" y="333" class="label-center">Auth store</text>
  <rect x="602" y="304" width="168" height="46" rx="14" class="chip"/>
  <text x="686" y="333" class="label-center">i18n + theme</text>
  <rect x="420" y="366" width="350" height="46" rx="14" class="chip"/>
  <text x="595" y="395" class="label-center">Pages: home, forum, packs, tournaments, admin</text>
  <rect x="420" y="426" width="350" height="28" rx="14" fill="#ffffff" opacity="0.72" stroke="#bfcede"/>
  <text x="595" y="445" class="tiny-center">VITE_API_BASE_URL -> backend API</text>

  <!-- Backend -->
  <rect x="920" y="145" width="520" height="330" rx="26" class="card backend"/>
  <text x="960" y="190" class="section-title">jack-house-web/backend</text>
  <text x="960" y="214" class="muted">Node.js + Express + Sequelize API service</text>

  <rect x="960" y="242" width="200" height="46" rx="14" class="chip"/>
  <text x="1060" y="266" class="label-center">Middleware</text>
  <text x="1060" y="284" class="muted-center">CORS, Helmet, CSRF</text>
  <rect x="1180" y="242" width="220" height="46" rx="14" class="chip"/>
  <text x="1290" y="266" class="label-center">Auth / permissions</text>
  <text x="1290" y="284" class="muted-center">HTTP-only cookie session</text>

  <rect x="960" y="304" width="440" height="46" rx="14" class="chip"/>
  <text x="1180" y="326" class="label-center">Routes</text>
  <text x="1180" y="342" class="muted-center">auth, user, tournament, pack, forum, event, badge, dashboard, upload</text>

  <rect x="960" y="366" width="212" height="60" rx="14" class="chip"/>
  <text x="1066" y="395" class="label-center">Tournament services</text>
  <text x="1066" y="412" class="muted-center">qualifier, bracket, referee</text>
  <rect x="1192" y="366" width="208" height="60" rx="14" class="chip"/>
  <text x="1296" y="395" class="label-center">Content services</text>
  <text x="1296" y="412" class="muted-center">packs, posts, rich text</text>
  <rect x="960" y="440" width="440" height="22" rx="11" fill="#ffffff" opacity="0.72" stroke="#b7d7c8"/>
  <text x="1180" y="456" class="tiny-center">api.jackhouse.xyz</text>

  <!-- Analytics -->
  <rect x="380" y="570" width="430" height="250" rx="26" class="card analytics"/>
  <text x="420" y="615" class="section-title">jack-house-analytics</text>
  <text x="420" y="639" class="muted">Shared analytics packages embedded into frontend and backend</text>
  <rect x="420" y="672" width="164" height="50" rx="14" class="chip"/>
  <text x="502" y="696" class="label-center">core + react</text>
  <text x="502" y="714" class="muted-center">pageview events</text>
  <rect x="606" y="672" width="164" height="50" rx="14" class="chip"/>
  <text x="688" y="696" class="label-center">server-express</text>
  <text x="688" y="714" class="muted-center">collect + stats</text>
  <rect x="420" y="744" width="350" height="40" rx="14" class="chip"/>
  <text x="595" y="769" class="label-center">/analytics/collect  and  /analytics/stats/*</text>

  <!-- Data and storage -->
  <rect x="920" y="570" width="520" height="300" rx="26" class="card data"/>
  <text x="960" y="615" class="section-title">Data and storage layer</text>
  <text x="960" y="639" class="muted">Persistent state for product features, tournaments, files, and metrics</text>

  <rect x="960" y="672" width="200" height="58" rx="16" class="chip"/>
  <text x="1060" y="702" class="label-center">MariaDB / MySQL</text>
  <text x="1060" y="718" class="muted-center">users, posts, packs, tournaments</text>
  <rect x="1180" y="672" width="220" height="58" rx="16" class="chip"/>
  <text x="1290" y="702" class="label-center">Analytics tables</text>
  <text x="1290" y="718" class="muted-center">events, daily stats, active time</text>

  <rect x="960" y="752" width="200" height="58" rx="16" class="chip"/>
  <text x="1060" y="782" class="label-center">Object storage</text>
  <text x="1060" y="798" class="muted-center">S3-compatible assets</text>
  <rect x="1180" y="752" width="220" height="58" rx="16" class="chip"/>
  <text x="1290" y="782" class="label-center">GitHub storage</text>
  <text x="1290" y="798" class="muted-center">rich text / submissions option</text>
  <rect x="960" y="828" width="440" height="22" rx="11" fill="#ffffff" opacity="0.72" stroke="#dec88b"/>
  <text x="1180" y="844" class="tiny-center">Sequelize models + storage provider abstraction</text>

  <!-- External -->
  <rect x="1510" y="170" width="230" height="300" rx="26" class="card external"/>
  <text x="1540" y="215" class="section-title">External systems</text>
  <rect x="1540" y="250" width="170" height="54" rx="14" class="soft"/>
  <text x="1625" y="279" class="label-center">osu! OAuth</text>
  <text x="1625" y="296" class="muted-center">login / binding</text>
  <rect x="1540" y="324" width="170" height="54" rx="14" class="soft"/>
  <text x="1625" y="353" class="label-center">osu! API</text>
  <text x="1625" y="370" class="muted-center">packs, scores, MP</text>
  <rect x="1540" y="398" width="170" height="44" rx="14" class="soft"/>
  <text x="1625" y="425" class="label-center">Google Sheets</text>

  <!-- Security ribbon -->
  <rect x="380" y="890" width="1060" height="86" rx="24" class="card security"/>
  <text x="420" y="929" class="section-title">Cross-cutting runtime controls</text>
  <text x="420" y="954" class="muted">HTTP-only auth cookies, CSRF header, CORS allowlist, rate limiting, i18n middleware, audit logs, deployment env checks</text>

  <!-- Connectors -->
  <path class="line-blue" d="M300 295 H350 Q365 295 365 310 V310 Q365 325 380 325"/>
  <text x="316" y="282" class="tiny">SPA routes</text>

  <path class="line-blue" d="M810 310 H890 Q905 310 920 310"/>
  <text x="836" y="294" class="tiny">Axios API calls</text>

  <path class="line-green" d="M1180 475 V548 Q1180 565 1180 570"/>
  <text x="1198" y="536" class="tiny">read / write</text>

  <path class="line-dashed" d="M920 410 H852 Q830 410 830 490 V654 Q830 676 810 676"/>
  <text x="834" y="398" class="tiny">collect + stats router</text>

  <path class="line" d="M1440 276 H1510"/>
  <text x="1448" y="259" class="tiny">OAuth login</text>

  <path class="line" d="M1440 352 H1510"/>
  <text x="1448" y="335" class="tiny">score and map reads</text>

  <path class="line-dashed" d="M1440 420 H1510"/>
  <text x="1448" y="404" class="tiny">CSV imports</text>

  <path class="line-blue" d="M595 475 V570"/>
  <text x="612" y="526" class="tiny">SDK + pageviews</text>

  <!-- Legend -->
  <rect x="70" y="906" width="230" height="70" rx="20" fill="#ffffff" stroke="#d7dee8"/>
  <circle cx="98" cy="930" r="6" fill="#edf5ff" stroke="#b9cce5"/>
  <text x="114" y="934" class="muted">Frontend</text>
  <circle cx="98" cy="954" r="6" fill="#edf8f3" stroke="#b7d7c8"/>
  <text x="114" y="958" class="muted">Backend</text>
  <circle cx="198" cy="930" r="6" fill="#fff7e8" stroke="#dec88b"/>
  <text x="214" y="934" class="muted">Data</text>
  <circle cx="198" cy="954" r="6" fill="#f2effb" stroke="#c9bee5"/>
  <text x="214" y="958" class="muted">Analytics</text>
</svg>
