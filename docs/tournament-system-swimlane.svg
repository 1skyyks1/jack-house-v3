<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">Jack House tournament swimlane flow</title>
  <desc id="desc">Detailed swimlane flow for Jack House tournament lifecycle across host, players, referee, frontend, backend services, and data systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="126%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 760 38px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .phase { font: 720 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263244; text-anchor: middle; dominant-baseline: middle; }
      .phase-sub { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #667085; text-anchor: middle; dominant-baseline: middle; }
      .lane { font: 750 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2937; text-anchor: middle; dominant-baseline: middle; }
      .lane-sub { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #667085; text-anchor: middle; dominant-baseline: middle; }
      .node-title { font: 680 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2f3b4f; text-anchor: middle; dominant-baseline: middle; }
      .node-sub { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; text-anchor: middle; dominant-baseline: middle; }
      .decision { font: 680 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2f3b4f; text-anchor: middle; dominant-baseline: middle; }
      .caption { font: 620 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; text-anchor: middle; dominant-baseline: middle; }
      .grid { stroke: #e5ebf3; stroke-width: 1; opacity: .70; }
      .phase-card { fill: #ffffff; stroke: #d7dee8; stroke-width: 1.4; filter: url(#shadow); }
      .lane-bg-a { fill: #ffffff; opacity: .72; }
      .lane-bg-b { fill: #f8fafc; opacity: .86; }
      .lane-line { stroke: #dbe3ef; stroke-width: 1.4; }
      .col-line { stroke: #dbe3ef; stroke-width: 1.2; stroke-dasharray: 6 10; }
      .host { fill: #eef6ff; stroke: #7fa8d9; stroke-width: 2; filter: url(#shadow); }
      .player { fill: #fff8e7; stroke: #d8bb66; stroke-width: 2; filter: url(#shadow); }
      .ref { fill: #fff1f1; stroke: #d89494; stroke-width: 2; filter: url(#shadow); }
      .front { fill: #f0f5ff; stroke: #8295ce; stroke-width: 2; filter: url(#shadow); }
      .back { fill: #f3effd; stroke: #a68add; stroke-width: 2.2; filter: url(#shadow); }
      .data { fill: #edf9f3; stroke: #7ebd9b; stroke-width: 2; filter: url(#shadow); }
      .decision-box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; filter: url(#shadow); }
      .main { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #94a3b8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-soft); }
      .loop { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 8; marker-end: url(#arrow-soft); }
      .badge { fill: #ffffff; stroke: #d7dee8; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="2400" height="1600" fill="url(#bg)"/>
  <path class="grid" d="M0 160 H2400 M0 320 H2400 M0 480 H2400 M0 640 H2400 M0 800 H2400 M0 960 H2400 M0 1120 H2400 M0 1280 H2400 M0 1440 H2400 M240 0 V1600 M480 0 V1600 M720 0 V1600 M960 0 V1600 M1200 0 V1600 M1440 0 V1600 M1680 0 V1600 M1920 0 V1600 M2160 0 V1600"/>

  <text x="80" y="70" class="title">Jack House 赛事系统泳道图</text>
  <text x="80" y="102" class="subtitle">按角色、前端页面、后端领域服务与数据系统拆分的完整赛事生命周期流程</text>
  <rect x="2002" y="52" width="308" height="40" rx="20" class="badge"/>
  <text x="2156" y="73" class="caption">tournament route / services / models</text>

  <!-- Phase header -->
  <rect x="300" y="140" width="330" height="64" rx="16" class="phase-card"/>
  <text x="465" y="165" class="phase">赛事筹备</text>
  <text x="465" y="187" class="phase-sub">创建、内容、staff、规则</text>
  <rect x="642" y="140" width="330" height="64" rx="16" class="phase-card"/>
  <text x="807" y="165" class="phase">报名组队</text>
  <text x="807" y="187" class="phase-sub">登录、组队、提交、审核</text>
  <rect x="984" y="140" width="330" height="64" rx="16" class="phase-card"/>
  <text x="1149" y="165" class="phase">资格赛</text>
  <text x="1149" y="187" class="phase-sub">MP 对局、拉分、修正</text>
  <rect x="1326" y="140" width="330" height="64" rx="16" class="phase-card"/>
  <text x="1491" y="165" class="phase">锁榜与正赛</text>
  <text x="1491" y="187" class="phase-sub">锁榜、晋级、生成 bracket</text>
  <rect x="1668" y="140" width="330" height="64" rx="16" class="phase-card"/>
  <text x="1833" y="165" class="phase">比赛执行</text>
  <text x="1833" y="187" class="phase-sub">裁判流程、赛果推进</text>
  <rect x="2010" y="140" width="330" height="64" rx="16" class="phase-card"/>
  <text x="2175" y="165" class="phase">展示沉淀</text>
  <text x="2175" y="187" class="phase-sub">公开页面、审计、历史数据</text>

  <!-- Swimlane backgrounds -->
  <rect x="56" y="232" width="2284" height="170" rx="20" class="lane-bg-a"/>
  <rect x="56" y="402" width="2284" height="170" rx="0" class="lane-bg-b"/>
  <rect x="56" y="572" width="2284" height="170" rx="0" class="lane-bg-a"/>
  <rect x="56" y="742" width="2284" height="170" rx="0" class="lane-bg-b"/>
  <rect x="56" y="912" width="2284" height="210" rx="0" class="lane-bg-a"/>
  <rect x="56" y="1122" width="2284" height="210" rx="20" class="lane-bg-b"/>

  <path class="lane-line" d="M56 402 H2340 M56 572 H2340 M56 742 H2340 M56 912 H2340 M56 1122 H2340 M250 232 V1332"/>
  <path class="col-line" d="M636 132 V1332 M978 132 V1332 M1320 132 V1332 M1662 132 V1332 M2004 132 V1332"/>

  <!-- Lane labels -->
  <text x="153" y="300" class="lane">Admin / Host</text>
  <text x="153" y="326" class="lane-sub">创建、配置、审核、发布</text>
  <text x="153" y="470" class="lane">Player / Captain</text>
  <text x="153" y="496" class="lane-sub">报名、组队、比赛</text>
  <text x="153" y="640" class="lane">Pooler / Referee</text>
  <text x="153" y="666" class="lane-sub">图池、拉分、执场</text>
  <text x="153" y="810" class="lane">jack-house-v3</text>
  <text x="153" y="836" class="lane-sub">页面与交互入口</text>
  <text x="153" y="1002" class="lane">Backend Services</text>
  <text x="153" y="1028" class="lane-sub">权限、事务、领域规则</text>
  <text x="153" y="1212" class="lane">Data / External</text>
  <text x="153" y="1238" class="lane-sub">数据库、osu!、导入日志</text>

  <!-- Admin / Host lane -->
  <rect x="330" y="262" width="270" height="58" rx="14" class="host"/>
  <text x="465" y="285" class="node-title">创建赛事</text>
  <text x="465" y="305" class="node-sub">creator host 自动写入 staff</text>
  <rect x="330" y="334" width="270" height="48" rx="14" class="host"/>
  <text x="465" y="358" class="node-title">配置规则 / 公告 / 时间</text>

  <rect x="672" y="276" width="270" height="58" rx="14" class="host"/>
  <text x="807" y="299" class="node-title">审核队伍与选手</text>
  <text x="807" y="319" class="node-sub">approve / player status</text>
  <rect x="738" y="350" width="138" height="36" rx="18" class="decision-box"/>
  <text x="807" y="368" class="decision">通过审核?</text>

  <rect x="1014" y="262" width="270" height="58" rx="14" class="host"/>
  <text x="1149" y="285" class="node-title">发布资格赛图池</text>
  <text x="1149" y="305" class="node-sub">qualifier maps / stage order</text>
  <rect x="1014" y="334" width="270" height="48" rx="14" class="host"/>
