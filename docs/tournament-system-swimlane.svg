  <text x="807" y="799" class="node-title">报名大厅 / 队伍页</text>
  <text x="807" y="819" class="node-sub">/t/:tid/teams</text>
  <rect x="1014" y="776" width="270" height="58" rx="14" class="front"/>
  <text x="1149" y="799" class="node-title">资格赛页面 / 导入后台</text>
  <text x="1149" y="819" class="node-sub">/qualifier + admin import</text>
