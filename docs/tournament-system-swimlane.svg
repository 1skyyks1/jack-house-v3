  <rect x="1014" y="1042" width="270" height="48" rx="14" class="back"/>
  <text x="1149" y="1066" class="node-title">manual correction / audit</text>

  <rect x="1356" y="958" width="270" height="66" rx="14" class="back"/>
  <text x="1491" y="982" class="node-title">bracketService</text>
  <text x="1491" y="1003" class="node-sub">seed / double elimination / slots</text>
  <g transform="translate(1491 1086)">
    <rect x="-36" y="-36" width="72" height="72" rx="10" class="decision-box" transform="rotate(45)"/>
    <text y="-5" class="decision">锁榜</text>
    <text y="12" class="decision">完成?</text>
  </g>

  <rect x="1698" y="958" width="270" height="66" rx="14" class="back"/>
  <text x="1833" y="982" class="node-title">refereeService</text>
  <text x="1833" y="1003" class="node-sub">actions / score / winner / undo</text>
  <g transform="translate(1833 1086)">
    <rect x="-36" y="-36" width="72" height="72" rx="10" class="decision-box" transform="rotate(45)"/>
    <text y="-5" class="decision">比赛</text>
    <text y="12" class="decision">结束?</text>
  </g>

  <rect x="2040" y="958" width="270" height="66" rx="14" class="back"/>
  <text x="2175" y="982" class="node-title">public tournament APIs</text>
  <text x="2175" y="1003" class="node-sub">sections / rankings / bracket / match</text>
  <rect x="2040" y="1042" width="270" height="48" rx="14" class="back"/>
  <text x="2175" y="1066" class="node-title">permission-safe response</text>

