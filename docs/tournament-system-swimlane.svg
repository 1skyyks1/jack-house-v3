  <text x="1491" y="819" class="node-sub">/bracket / rounds / matches</text>
  <rect x="1698" y="776" width="270" height="58" rx="14" class="front"/>
  <text x="1833" y="799" class="node-title">裁判工作台 / 比赛页</text>
  <text x="1833" y="819" class="node-sub">/referee/:matchId / match detail</text>
  <rect x="2040" y="776" width="270" height="58" rx="14" class="front"/>
  <text x="2175" y="799" class="node-title">公开赛事页面</text>
  <text x="2175" y="819" class="node-sub">rules / mappool / standings</text>

  <!-- Backend lane -->
  <rect x="330" y="958" width="270" height="66" rx="14" class="back"/>
  <text x="465" y="982" class="node-title">tournamentService</text>
  <text x="465" y="1003" class="node-sub">create / update / acronym / status</text>
  <rect x="330" y="1042" width="270" height="48" rx="14" class="back"/>
  <text x="465" y="1066" class="node-title">contentService / staffService</text>

  <rect x="672" y="958" width="270" height="66" rx="14" class="back"/>
  <text x="807" y="982" class="node-title">teamService</text>
