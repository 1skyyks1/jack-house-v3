  <rect x="1356" y="266" width="270" height="58" rx="14" class="host"/>
  <text x="1491" y="289" class="node-title">锁定资格赛榜单</text>
  <text x="1491" y="309" class="node-sub">lock snapshot</text>
  <rect x="1356" y="340" width="270" height="48" rx="14" class="host"/>
  <text x="1491" y="364" class="node-title">生成正赛 bracket</text>

  <rect x="1698" y="280" width="270" height="58" rx="14" class="host"/>
  <text x="1833" y="303" class="node-title">发布赛程与房间信息</text>
  <text x="1833" y="323" class="node-sub">round / match / stream links</text>

  <rect x="2040" y="292" width="270" height="58" rx="14" class="host"/>
  <text x="2175" y="315" class="node-title">归档赛事</text>
  <text x="2175" y="335" class="node-sub">最终结果与历史资料</text>

  <!-- Player / Captain lane -->
  <rect x="672" y="432" width="270" height="58" rx="14" class="player"/>
  <text x="807" y="455" class="node-title">osu! 登录</text>
  <text x="807" y="475" class="node-sub">站内 User 作为身份源</text>
  <rect x="672" y="504" width="270" height="48" rx="14" class="player"/>
  <text x="807" y="528" class="node-title">创建 / 加入 / 提交队伍</text>

  <rect x="1014" y="444" width="270" height="58" rx="14" class="player"/>
  <text x="1149" y="467" class="node-title">完成资格赛 MP</text>
  <text x="1149" y="487" class="node-sub">一个或多个 MP 房</text>
  <rect x="1014" y="516" width="270" height="48" rx="14" class="player"/>
  <text x="1149" y="540" class="node-title">查看分图与总排行</text>

  <rect x="1698" y="444" width="270" height="58" rx="14" class="player"/>
  <text x="1833" y="467" class="node-title">参加正赛 match</text>
  <text x="1833" y="487" class="node-sub">按裁判流程完成对局</text>
  <rect x="2040" y="478" width="270" height="58" rx="14" class="player"/>
  <text x="2175" y="501" class="node-title">查看赛果与排名</text>
  <text x="2175" y="521" class="node-sub">qualification / bracket</text>

  <!-- Pooler / Referee lane -->
  <rect x="1014" y="604" width="270" height="58" rx="14" class="ref"/>
  <text x="1149" y="627" class="node-title">核对 MP ID / 导入批次</text>
  <text x="1149" y="647" class="node-sub">fetch single / batch</text>
  <rect x="1014" y="676" width="270" height="48" rx="14" class="ref"/>
  <text x="1149" y="700" class="node-title">人工 correction</text>

  <rect x="1698" y="604" width="270" height="58" rx="14" class="ref"/>
  <text x="1833" y="627" class="node-title">进入裁判工作台</text>
  <text x="1833" y="647" class="node-sub">referee desk data</text>
  <rect x="1698" y="676" width="270" height="48" rx="14" class="ref"/>
  <text x="1833" y="700" class="node-title">Roll / Protect / Ban / Pick</text>

