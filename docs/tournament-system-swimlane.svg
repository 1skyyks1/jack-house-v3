  <text x="1491" y="1194" class="node-title">TRound / TMatch</text>
  <text x="1491" y="1215" class="node-sub">bracket slot、上下游关系</text>
  <rect x="1698" y="1170" width="270" height="64" rx="14" class="data"/>
  <text x="1833" y="1194" class="node-title">TGame / TMatchAction</text>
  <text x="1833" y="1215" class="node-sub">ban/pick/timeouts/game score</text>
  <rect x="2040" y="1170" width="270" height="64" rx="14" class="data"/>
  <text x="2175" y="1194" class="node-title">TAuditLog / history</text>
  <text x="2175" y="1215" class="node-sub">审计、导入日志、历史沉淀</text>
  <rect x="672" y="1252" width="270" height="48" rx="14" class="data"/>
  <text x="807" y="1276" class="node-title">Google Sheets import</text>
  <rect x="1718" y="1252" width="230" height="48" rx="14" class="data"/>
  <text x="1833" y="1276" class="node-title">osu! match scores</text>

