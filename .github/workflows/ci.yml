name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: jack-house-v3
      - uses: actions/checkout@v4
        with:
          repository: 1skyyks1/jack-house-analytics
          path: jack-house-analytics
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            jack-house-v3/pnpm-lock.yaml
            jack-house-analytics/pnpm-lock.yaml
      - name: Build analytics packages
        run: |
          pnpm --dir jack-house-analytics install --frozen-lockfile
          pnpm --dir jack-house-analytics build
          mkdir -p .packed/jack-house-analytics
          pnpm --dir jack-house-analytics --filter @jack-house-analytics/core pack --pack-destination "$GITHUB_WORKSPACE/.packed/jack-house-analytics"
          pnpm --dir jack-house-analytics --filter @jack-house-analytics/react pack --pack-destination "$GITHUB_WORKSPACE/.packed/jack-house-analytics"
      - name: Install
        run: pnpm --dir jack-house-v3 install --frozen-lockfile
      - name: Lint
        run: pnpm --dir jack-house-v3 lint
      - name: Build
        run: pnpm --dir jack-house-v3 build
